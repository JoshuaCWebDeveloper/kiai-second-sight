[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "kiai-second-sight"
version = "0.1.0"
description = "Turn Go mistakes into visual study cards using KataGo analysis."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "JoshuaCWebDeveloper"}]
dependencies = [
  "Pillow>=10.4",
  "python-pptx>=1.0.2",
  "sgfmill>=1.1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
kiai-second-sight = "kiai_second_sight.cli:main"
kiai = "kiai_second_sight.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kiai_second_sight"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
