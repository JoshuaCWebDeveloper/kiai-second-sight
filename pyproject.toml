[tool.poetry]
name = "kiai-second-sight"
version = "0.1.0"
description = "Turn Go mistakes into visual study cards using KataGo analysis."
authors = ["JoshuaCWebDeveloper"]
license = "MIT"
readme = "README.md"
packages = [{ include = "kiai_second_sight", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
Pillow = ">=10.4"
python-pptx = ">=1.0.2"
sgfmill = ">=1.1.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
ruff = ">=0.9"

[tool.poetry.scripts]
kiai-second-sight = "kiai_second_sight.cli:main"
kiai = "kiai_second_sight.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
