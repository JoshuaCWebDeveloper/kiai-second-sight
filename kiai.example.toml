[player]
# Used to infer whether you were Black or White from SGF PB/PW fields.
names = ["your-ogs-name"]

[analysis]
# By default Second Sight downloads and manages KataGo, its analysis config, and a model.
# "auto" benchmarks OpenCL, Eigen AVX2, and Eigen during kiai setup and keeps the fastest working backend.
# You can also force "opencl", "eigenavx2", or "eigen".
managed_backend = "auto"
# managed_root = "~/.kiai-second-sight/katago"

# To use your own KataGo/KaTrain installation instead, configure ALL THREE paths below.
# If all three are present, they take precedence and nothing is downloaded.
# katago_path = "C:/path/to/katago.exe"
# model_path = "C:/path/to/model.bin.gz"
# config_path = "C:/path/to/analysis_config.cfg"

# Cheap whole-game screening pass. Only plausible mistakes are re-analyzed at max_visits.
screening_visits = 25
max_visits = 500

[selection]
# A card is created only when your pre-move win rate is strictly above this value...
min_start_winrate = 0.50
# ...and your move loses at least this many absolute win-rate points.
min_loss_pp = 0.10
# Screening is intentionally generous so low-visit noise does not hide borderline mistakes.
screening_start_margin = 0.05
screening_loss_margin = 0.05

[render]
top_moves = 5
image_size = 1200

[output]
root = "."
